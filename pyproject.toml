[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "options-anomaly-demo"
version = "0.1.0"
description = "Type a ticker. Explore options anomalies, quote quality, and plots."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
tws = ["ib_async>=2.1,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
options-demo = "options_demo.cli:main"

[tool.setuptools.packages.find]
include = ["options_demo*"]

[tool.setuptools.package-data]
options_demo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
